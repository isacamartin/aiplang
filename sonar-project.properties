# Template — copiado pelo install.sh com {{PLACEHOLDERS}} substituídos.
sonar.projectKey=oplena-aiplang-codigo-fonte
sonar.projectName=aiplang/codigo-fonte
sonar.projectVersion=0.1
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Excluir buildões e deps que não são "código nosso".
sonar.exclusions=\
  **/node_modules/**,\
  **/.dart_tool/**,\
  **/build/**,\
  **/dist/**,\
  **/bin/**,\
  **/vendor/**,\
  **/.venv/**,\
  **/venv/**,\
  **/coverage/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**

# Cobertura: aponta pros arquivos gerados pelos pipelines.
sonar.go.coverage.reportPaths=coverage.out,aiplang-go/coverage.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.dart.coverage.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Servidor local. Em CI sobrescreva via SONAR_HOST_URL.
sonar.host.url=http://localhost:9000
